[package]
name = "server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
chronicler = { git = "https://github.com/MauroMombelli/chronicler", branch = "main" }
diesel = { version = "2", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2"
libsqlite3-sys = { version = "0.28", features = ["bundled"] }
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ulid = { version = "1", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
sha2 = "0.10"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
# Integration tests only see server's public API + dev-dependencies, so
# generating a valid code to test the OTP login path needs its own copy.
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
