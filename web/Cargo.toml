[package]
name = "lestobackupper-web"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
lestobackupper-schema = { path = "../schema" }
planus = "1"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "WebSocket", "MessageEvent", "BinaryType", "ErrorEvent", "Event",
  "File", "FileList", "HtmlInputElement", "Blob", "BlobPropertyBag", "Url",
  "Element", "HtmlElement", "Window", "Document", "Storage",
  "DragEvent", "DataTransfer", "History", "Location", "NodeList",
]

[profile.release]
opt-level = "z"
lto = true
