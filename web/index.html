<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LestoBackupper</title>
    <style>
      :root {
        --bg: #f7f7f8;
        --fg: #1a1a1a;
        --panel: #ffffff;
        --border: #ddd;
        --accent: #2d6cdf;
        --muted: #666;
      }
      html[data-theme="dark"] {
        --bg: #16171a;
        --fg: #eaeaea;
        --panel: #212226;
        --border: #33343a;
        --accent: #5b9dff;
        --muted: #999;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
      button, input, select {
        font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border);
        border-radius: 6px; padding: 6px 10px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0; }
      .row { display: flex; gap: 8px; }
      .auth { max-width: 360px; margin: 10vh auto; display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
      .auth .row { justify-content: space-between; }
      .hint { color: var(--muted); font-size: 0.85em; }
      .app { display: flex; flex-direction: column; min-height: 100vh; }
      nav { display: flex; align-items: center; gap: 4px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
      nav .brand { font-weight: 700; margin-right: 12px; }
      nav .spacer { flex: 1; }
      /* Without this, plain <a> tags fall back to the browser's default
         link style — underlined, blue — which swallows the mnemonic
         span's single-letter underline entirely (the whole word is
         already underlined) and doesn't match the rest of the app. */
      nav a { text-decoration: none; color: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid transparent; }
      nav a:hover { border-color: var(--accent); }
      nav a.active, nav button.active { border-color: var(--accent); color: var(--accent); }
      main { padding: 16px; flex: 1; }
      .status { color: var(--muted); min-height: 1.2em; }
      .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
      .upload-button {
        display: inline-flex; align-items: center; cursor: pointer;
        background: var(--accent); color: #fff; border: 1px solid var(--accent);
        border-radius: 6px; padding: 6px 14px; font-weight: 600;
      }
      .upload-button:hover { opacity: 0.9; }
      .dropzone { border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center; margin-bottom: 16px; transition: border-color 0.15s, background 0.15s; }
      .dropzone.drag-over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
      .empty { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
      .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; }
      .tile .placeholder { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); background: var(--bg); border-radius: 4px; }
      .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .album-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
      .album-card:hover { border-color: var(--accent); }
      .album-card a { text-decoration: none; color: inherit; display: block; }
      .album-preview { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--bg); margin-bottom: 8px; }
      .album-preview img { width: 100%; height: 100%; object-fit: cover; }
      .album-preview .empty-slot { background: var(--bg); }
      .album-card .name { font-weight: 600; }
      .hidden-toggle { margin-top: 4px; }
      .pending-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .pending-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; max-width: 420px; }
      .panel h2 { margin-top: 0; font-size: 1.05em; }
      .panel input[type="text"], .panel input[type="password"] { display: block; width: 100%; margin-bottom: 8px; }
      .panel label.checkbox-row { display: flex; align-items: center; gap: 8px; }
      .panel label.checkbox-row input[type="checkbox"] { width: auto; margin: 0; }
      .otp-url { word-break: break-all; color: var(--muted); font-size: 0.85em; }
      .qr-code { background: #fff; padding: 8px; border-radius: 6px; width: fit-content; margin: 8px 0; }
      .picture-view img { max-width: 100%; max-height: 80vh; display: block; margin: 0 auto; border-radius: 8px; filter: blur(0); transition: filter 0.2s ease-out; }
      .picture-view img.loading-full { filter: blur(16px); transform: scale(1.02); }
      .picture-view .toolbar { flex-wrap: wrap; justify-content: space-between; }
      .slideshow-controls { display: flex; align-items: center; gap: 8px; }
      .slideshow-controls button:disabled { opacity: 0.4; cursor: default; }
      .autoplay-seconds { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 0.9em; }
      .autoplay-seconds input { width: 56px; padding: 4px 6px; }
      .mnemonic { text-decoration: underline; text-underline-offset: 2px; }
      .bulk-bar { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
      .bulk-bar .count { font-weight: 600; }
      .tile.grid-focused, .album-card.grid-focused { outline: 2px solid var(--accent); outline-offset: 2px; }
      .tile.grid-selected, .album-card.grid-selected { box-shadow: 0 0 0 2px var(--accent) inset; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
    </style>
    <!-- Newer/experimental visual refinements live here, separate from the
         base styles above — pure presentation, no selector here is tied to
         a behavior hook (on:click targets, form structure, etc.), so this
         file can be edited or reverted freely without touching markup. -->
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <script type="module">
      // Root-relative, not "./pkg/..." — a direct visit to /albums/<id> (or
      // any other client-routed path) serves this same file via the dev
      // server's/reverse proxy's SPA fallback, and a relative import would
      // then resolve against /albums/<id> instead of /, 404ing silently.
      import init from "/pkg/lestobackupper_web.js";
      init();
    </script>
  </body>
</html>
